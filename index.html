<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran Event</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --card: #1a1a1f;
    --border: #2c2c34;
    --accent: #ffc400;
    --text: #f5f5f5;
    --muted: #9a9aa5;
    --danger: #ff5c5c;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1a22 0%, #0d0d0f 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container { width: 100%; max-width: 420px; }

  .header { text-align: center; margin-bottom: 22px; }
  .header h1 {
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: 800;
    color: var(--accent);
  }
  .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  }

  /* ===== Form ===== */
  .form-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
    margin-bottom: 4px;
  }
  .form-sub {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 20px;
  }

  .field { display: block; margin-bottom: 16px; }
  .field span {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #101014;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border .2s, box-shadow .2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 196, 0, .15);
  }

  button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:active { transform: scale(.98); }

  #btnDaftar { background: var(--accent); color: #111; margin-top: 6px; }
  #btnDaftar:hover { background: #ffd23f; }
  #btnDaftar:disabled { opacity: .6; cursor: not-allowed; }

  .switch-link {
    display: block;
    width: 100%;
    margin-top: 14px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0;
    text-align: center;
    cursor: pointer;
    text-decoration: underline;
    padding: 6px;
  }
  .switch-link:hover { color: var(--text); }
  .switch-link b { color: var(--accent); }

  .message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .message.error { color: var(--danger); }
  .message.info  { color: var(--muted); }

  /* ===== Dashboard ===== */
  .dashboard { display: none; text-align: center; }
  .dashboard.show { display: block; animation: fadeIn .35s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dash-greet { font-size: 13px; color: var(--muted); }
  .dash-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 4px;
    word-break: break-word;
  }
  .dash-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  .qr-wrap { display: flex; justify-content: center; margin: 10px 0 18px; }
  .qr-wrap img, .qr-wrap canvas {
    background: #fff;
    padding: 10px;
    border-radius: 12px;
  }

  .undian {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: #101014;
  }
  .undian-label { font-size: 12px; letter-spacing: 2px; color: var(--muted); }
  .undian-number {
    font-size: 34px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 6px;
  }

  .dash-actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }

  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .btn-secondary:hover { background: rgba(255, 196, 0, .1); }

  .btn-logout {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .btn-logout:hover { background: rgba(255, 92, 92, .1); }

  @media print {
    body { background: #fff; color: #000; }
    .header, #formCard, .dash-actions, .dash-sub { display: none; }
    .card { border: none; box-shadow: none; background: #fff; }
    .dash-name, .undian-number { color: #000; }
    .undian { background: #fff; border-color: #ccc; }
  }
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <h1>PENDAFTARAN EVENT</h1>
    <p class="subtitle" id="headerSub">Daftar sekali, dapat QR Code &amp; nomor undian</p>
  </header>

  <!-- ==== FORM (DAFTAR / MASUK) ==== -->
  <section class="card" id="formCard">
    <h2 class="form-title" id="formTitle">DAFTAR</h2>
    <p class="form-sub" id="formSub">Belum punya akun? Isi data di bawah ini.</p>

    <label class="field">
      <span>Nama Lengkap</span>
      <input id="nama" type="text" placeholder="Masukkan nama lengkap" maxlength="60" autocomplete="name">
    </label>

    <label class="field">
      <span>PIN (5 digit angka)</span>
      <input id="pin" type="password" inputmode="numeric" maxlength="5" placeholder="Contoh: 12345" autocomplete="off">
    </label>

    <button id="btnDaftar" type="button">DAFTAR</button>

    <button class="switch-link" type="button" id="btnSwitch">
      <span id="switchText">Sudah punya akun? <b>MASUK</b></span>
    </button>

    <div id="message" class="message"></div>
  </section>

  <!-- ==== DASHBOARD ==== -->
  <section class="card dashboard" id="dashCard">
    <p class="dash-greet">Selamat datang,</p>
    <h2 class="dash-name" id="dashNama"></h2>
    <p class="dash-sub" id="dashSub">Berikut QR Code &amp; nomor undian Anda</p>

    <div class="qr-wrap"><div id="qrcode"></div></div>

    <div class="undian">
      <span class="undian-label">NOMOR UNDIAN ANDA</span>
      <span class="undian-number" id="nomorUndian"></span>
    </div>

    <div class="dash-actions">
      <button class="btn-secondary" type="button" onclick="window.print()">SIMPAN / CETAK</button>
      <button class="btn-secondary" type="button" id="btnRefresh">⟳ Refresh</button>
      <button class="btn-logout" type="button" id="btnLogout">Logout</button>
    </div>
  </section>

</div>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbyg3sDxkMVUHMQbQGFZIXdOfhm2VACuM-rr8FMYO12eBlpEa3REXJ-ctN5HlqXok1lCUw/exec";
  var SESSION_KEY = "pesertaDashboard";

  window.addEventListener("DOMContentLoaded", function () {

    var elNama     = document.getElementById("nama");
    var elPin      = document.getElementById("pin");
    var elMsg      = document.getElementById("message");
    var btn        = document.getElementById("btnDaftar");
    var btnSwitch  = document.getElementById("btnSwitch");
    var btnRefresh = document.getElementById("btnRefresh");
    var btnLogout  = document.getElementById("btnLogout");

    // mode: "daftar" atau "masuk"
    var mode = "daftar";

    btn.addEventListener("click", submit);
    btnSwitch.addEventListener("click", toggleMode);
    btnRefresh.addEventListener("click", refresh);
    btnLogout.addEventListener("click", logout);

    // Kalau ada sesi tersimpan -> langsung tampil dashboard
    var saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      try { tampilkanDashboard(JSON.parse(saved)); }
      catch (e) { sessionStorage.removeItem(SESSION_KEY); }
    }

    // ===== Ganti mode DAFTAR <-> MASUK =====
    function toggleMode() {
      mode = (mode === "daftar") ? "masuk" : "daftar";
      setMessage("", "");
      elNama.value = "";
      elPin.value  = "";

      var formTitle = document.getElementById("formTitle");
      var formSub   = document.getElementById("formSub");
      var switchText= document.getElementById("switchText");

      if (mode === "daftar") {
        formTitle.textContent = "DAFTAR";
        formSub.textContent   = "Belum punya akun? Isi data di bawah ini.";
        btn.textContent       = "DAFTAR";
        switchText.innerHTML  = 'Sudah punya akun? <b>MASUK</b>';
      } else {
        formTitle.textContent = "MASUK";
        formSub.textContent   = "Masukkan Nama & PIN Anda untuk melihat QR Code.";
        btn.textContent       = "MASUK";
        switchText.innerHTML  = 'Belum punya akun? <b>DAFTAR</b>';
      }

      elNama.focus();
    }

    // ===== Kirim (DAFTAR atau MASUK) =====
    function submit() {
      var nama = elNama.value.trim();
      var pin  = elPin.value.trim();

      setMessage("", "");

      if (nama.length < 2) {
        setMessage("Nama minimal 2 karakter.", "error");
        elNama.focus();
        return;
      }
      if (!/^\d{5}$/.test(pin)) {
        setMessage("PIN harus tepat 5 digit angka.", "error");
        elPin.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = "MEMPROSES...";
      setMessage("Sedang mengirim data...", "info");

      // mode daftar & masuk pakai endpoint yang sama,
      // backend otomatis: baru -> daftar, sudah ada -> login
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ nama: nama, pin: pin, aksi: mode })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.success) {
          setMessage(data.message || "Gagal.", "error");
          resetButton();
          return;
        }
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(data));
        tampilkanDashboard(data);
      })
      .catch(function (err) {
        console.error(err);
        setMessage("Gagal terhubung ke server. Coba lagi.", "error");
        resetButton();
      });
    }

    // ===== Tampilkan dashboard =====
    function tampilkanDashboard(data) {
      document.getElementById("formCard").style.display = "none";

      document.getElementById("dashNama").textContent    = data.nama;
      document.getElementById("nomorUndian").textContent = data.nomorUndian;

      // Info mode: baru daftar atau kembali login
      var dashSub = document.getElementById("dashSub");
      if (data.status === "login") {
        dashSub.textContent = "Selamat datang kembali! Ini QR Code & nomor undian Anda.";
      } else {
        dashSub.textContent = "Pendaftaran berhasil! Simpan QR Code & nomor undian Anda.";
      }

      var qrBox = document.getElementById("qrcode");
      qrBox.innerHTML = "";
      new QRCode(qrBox, {
        text: data.qrCode,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById("dashCard").classList.add("show");
    }

    // ===== Refresh page (dashboard tetap tampil) =====
    function refresh() {
      location.reload();
    }

    // ===== Logout (hapus sesi -> kembali ke form) =====
    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    // ===== Helper =====
    function setMessage(text, type) {
      elMsg.textContent = text;
      elMsg.className = "message" + (type ? " " + type : "");
    }

    function resetButton() {
      btn.textContent = (mode === "daftar") ? "DAFTAR" : "MASUK";
      btn.disabled = false;
    }

  });
</script>

</body>
</html>
