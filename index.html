<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran Event</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --card: #1a1a1f;
    --border: #2c2c34;
    --accent: #ffc400;
    --text: #f5f5f5;
    --muted: #9a9aa5;
    --danger: #ff5c5c;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1a22 0%, #0d0d0f 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container { width: 100%; max-width: 420px; }

  .header { text-align: center; margin-bottom: 22px; }
  .header h1 {
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: 800;
    color: var(--accent);
  }
  .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  }

  .field { display: block; margin-bottom: 16px; }
  .field span {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #101014;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border .2s, box-shadow .2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 196, 0, .15);
  }

  button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:active { transform: scale(.98); }

  #btnDaftar { background: var(--accent); color: #111; margin-top: 6px; }
  #btnDaftar:hover { background: #ffd23f; }
  #btnDaftar:disabled { opacity: .6; cursor: not-allowed; }

  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    margin-top: 22px;
  }
  .btn-secondary:hover { background: rgba(255, 196, 0, .1); }

  .btn-link {
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0;
    margin-top: 12px;
    text-decoration: underline;
  }
  .btn-link:hover { color: var(--text); }

  .message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .message.error { color: var(--danger); }
  .message.info  { color: var(--muted); }

  .result { display: none; text-align: center; }
  .result.show { display: block; animation: fadeIn .35s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .success-title { font-size: 18px; color: var(--accent); margin-bottom: 14px; }
  .hasil-nama { font-size: 14px; color: var(--muted); margin-bottom: 10px; }

  .qr-wrap { display: flex; justify-content: center; margin: 18px 0; }
  .qr-wrap img, .qr-wrap canvas {
    background: #fff;
    padding: 10px;
    border-radius: 12px;
  }

  .undian {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: #101014;
  }
  .undian-label { font-size: 12px; letter-spacing: 2px; color: var(--muted); }
  .undian-number {
    font-size: 34px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 6px;
  }

  @media print {
    body { background: #fff; color: #000; }
    #formCard { display: none; }
    .btn-secondary, .btn-link { display: none; }
    .card { border: none; box-shadow: none; background: #fff; }
    .undian { background: #fff; border-color: #ccc; }
    .undian-number, .success-title, .hasil-nama { color: #000; }
  }
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <h1>PENDAFTARAN EVENT</h1>
    <p class="subtitle">Isi data untuk mendapatkan QR Code &amp; nomor undian</p>
  </header>

  <!-- ==== FORM ==== -->
  <section class="card" id="formCard">
    <label class="field">
      <span>Nama Lengkap</span>
      <input id="nama" type="text" placeholder="Masukkan nama lengkap" maxlength="60" autocomplete="name">
    </label>

    <label class="field">
      <span>PIN (5 digit angka)</span>
      <input id="pin" type="password" inputmode="numeric" maxlength="5" placeholder="Contoh: 12345" autocomplete="off">
    </label>

    <button id="btnDaftar" type="button">DAFTAR</button>
    <div id="message" class="message"></div>
  </section>

  <!-- ==== HASIL ==== -->
  <section class="card result" id="resultCard">
    <h2 class="success-title">Pendaftaran Berhasil 🎉</h2>
    <p class="hasil-nama">Nama: <strong id="hasilNama"></strong></p>

    <div class="qr-wrap"><div id="qrcode"></div></div>

    <div class="undian">
      <span class="undian-label">NOMOR UNDIAN ANDA</span>
      <span class="undian-number" id="nomorUndian"></span>
    </div>

    <button class="btn-secondary" type="button" onclick="window.print()">SIMPAN / CETAK</button>
    <button class="btn-link" type="button" id="btnUlang">Daftar lagi</button>
  </section>

</div>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbyg3sDxkMVUHMQbQGFZIXdOfhm2VACuM-rr8FMYO12eBlpEa3REXJ-ctN5HlqXok1lCUw/exec";

  window.addEventListener("DOMContentLoaded", function () {

    var elNama  = document.getElementById("nama");
    var elPin   = document.getElementById("pin");
    var elMsg   = document.getElementById("message");
    var btn     = document.getElementById("btnDaftar");
    var btnUlang= document.getElementById("btnUlang");

    btn.addEventListener("click", daftar);
    btnUlang.addEventListener("click", daftarLagi);

    function daftar() {
      var nama = elNama.value.trim();
      var pin  = elPin.value.trim();

      setMessage("", "");

      if (nama.length < 2) {
        setMessage("Nama minimal 2 karakter.", "error");
        elNama.focus();
        return;
      }
      if (!/^\d{5}$/.test(pin)) {
        setMessage("PIN harus tepat 5 digit angka.", "error");
        elPin.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = "MEMPROSES...";
      setMessage("Sedang mengirim data...", "info");

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ nama: nama, pin: pin })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.success) {
          setMessage(data.message || "Pendaftaran gagal.", "error");
          resetButton();
          return;
        }
        tampilkanHasil(data);
      })
      .catch(function (err) {
        console.error(err);
        setMessage("Gagal terhubung ke server. Coba lagi.", "error");
        resetButton();
      });
    }

    function tampilkanHasil(data) {
      document.getElementById("formCard").style.display = "none";

      document.getElementById("hasilNama").textContent   = data.nama;
      document.getElementById("nomorUndian").textContent = data.nomorUndian;

      var qrBox = document.getElementById("qrcode");
      qrBox.innerHTML = "";
      new QRCode(qrBox, {
        text: data.qrCode,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById("resultCard").classList.add("show");
    }

    function daftarLagi() {
      elNama.value = "";
      elPin.value  = "";
      document.getElementById("qrcode").innerHTML = "";
      document.getElementById("resultCard").classList.remove("show");
      document.getElementById("formCard").style.display = "block";

      setMessage("", "");
      resetButton();
      elNama.focus();
    }

    function setMessage(text, type) {
      elMsg.textContent = text;
      elMsg.className = "message" + (type ? " " + type : "");
    }

    function resetButton() {
      btn.textContent = "DAFTAR";
      btn.disabled = false;
    }

  });
</script>

</body>
</html>
